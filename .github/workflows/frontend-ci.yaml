name: Frontend CI
on:
  push:
    branches: [main]
    paths: 
      - 'frontend/**'
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:
    build-push-docker-image:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}



            # - name: docker build image
            #   run: |
            #     docker build -t ${{ secrets.DOCKER_USERNAME }}/chatapp-frontend:latest ./frontend
            #     echo "Docker images built successfully"

            # - name: Push images to Docker Hub
            #   run: |
            #     docker push ${{ secrets.DOCKER_USERNAME }}/chatapp-frontend:latest
            #     echo "Docker images pushed to Docker Hub successfully"


            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/chatapp-frontend:latest